[workspace]
resolver = "3"
exclude = ["examples/minimal-api"]
members = ["crates/core", "crates/validation", "crates/database", "crates/claw", "crates/auth", "crates/openapi", "crates/cache", "crates/storage", "crates/events", "crates/jobs", "crates/client", "crates/notifications", "crates/cli", "crates/testing", "crates/framework", "examples/foundation", "benchmarks"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
framework-core = { path = "crates/core", version = "=0.0.0" }
framework-database = { path = "crates/database", version = "=0.0.0" }
claw-orm = { path = "crates/claw", version = "=0.0.0" }
framework-auth = { path = "crates/auth", version = "=0.0.0" }
framework-openapi = { path = "crates/openapi", version = "=0.0.0" }
framework-cache = { path = "crates/cache", version = "=0.0.0" }
framework-storage = { path = "crates/storage", version = "=0.0.0" }
framework-events = { path = "crates/events", version = "=0.0.0" }
framework-jobs = { path = "crates/jobs", version = "=0.0.0" }
framework-client = { path = "crates/client", version = "=0.0.0" }
framework-notifications = { path = "crates/notifications", version = "=0.0.0" }
framework-cli = { path = "crates/cli", version = "=0.0.0" }
framework-testing = { path = "crates/testing", version = "=0.0.0" }
framework = { path = "crates/framework", version = "=0.0.0" }
