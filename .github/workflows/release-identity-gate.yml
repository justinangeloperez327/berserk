name: Release Identity Gate
on:
  push:
    branches: [release-identity]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Reject stale Berserk 1.2 identity
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='Cargo.lock' -E '(^|[^0-9])v?1\.2\.0([^0-9]|$)' -- Cargo.toml crates examples benchmarks fuzz scripts README.md docs CHANGELOG.md; then
            echo "stale Berserk 1.2.0 identity found"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path("Cargo.lock").read_text()
          workspace = {
              "berserk", "berserk-auth", "berserk-benchmarks", "berserk-cache",
              "berserk-cli", "berserk-client", "berserk-core", "berserk-database",
              "berserk-events", "berserk-jobs", "berserk-notifications",
              "berserk-openapi", "berserk-storage", "berserk-testing",
              "berserk-validation", "claw-orm", "foundation-example",
          }
          import re
          for block in text.split("[[package]]"):
              name_match = re.search(r'^name = "([^"]+)"
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Release plan
        run: python3 scripts/release_plan.py
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
, block, re.MULTILINE)
              version_match = re.search(r'^version = "([^"]+)"
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Release plan
        run: python3 scripts/release_plan.py
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
, block, re.MULTILINE)
              name = name_match.group(1) if name_match else None
              version = version_match.group(1) if version_match else None
              if name in workspace and version != "1.0.0":
                  raise SystemExit(f"{name}: expected 1.0.0, got {version}")
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Release plan
        run: python3 scripts/release_plan.py
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

