name: Update rustls lock

on:
  push:
    branches:
      - chatgpt/framework-refresh

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/framework-refresh
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Update rustls lock entry
        run: cargo update -p rustls --precise 0.23.45
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already resolves rustls 0.23.45"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update rustls to 0.23.45"
          git push origin HEAD:chatgpt/framework-refresh
