name: Extensibility Gate

on:
  push:
    branches:
      - extensibility-control

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Test framework
        run: cargo test --locked -p berserk --all-features
      - name: Clippy
        run: cargo clippy --locked -p berserk --all-targets --all-features -- -D warnings
