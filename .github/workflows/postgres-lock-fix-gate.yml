name: PostgreSQL migration lock fix gate

on:
  push:
    branches: [fix/postgres-migration-lock]
    paths:
      - ".postgres-lock-fix-ready"

permissions:
  contents: write

jobs:
  validate-format-promote:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: berserk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d berserk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FRAMEWORK_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/berserk
      BERSERK_REQUIRE_LIVE_DATABASES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postgres-migration-lock
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace
      - run: cargo test --locked -p berserk-database --features postgres --test postgres
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style(database): format PostgreSQL migration lock fix"
          fi
      - name: Promote validated fix
        run: git push origin HEAD:fix/postgres-migration-lock-ready
