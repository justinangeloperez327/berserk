name: Project Structure Gate
on:
  push:
    branches: [project-structure]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --exit-code
      - name: CLI tests
        run: cargo test --locked -p berserk-cli
      - name: Verify generators
        run: python3 scripts/verify_generators.py
      - name: Workspace check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked -p berserk-cli --all-targets -- -D warnings
