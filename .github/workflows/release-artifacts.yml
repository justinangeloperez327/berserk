name: Release artifacts

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/release_plan.py"
      - ".github/workflows/release-artifacts.yml"
      - "docs/release-provenance.md"
      - "docs/release-checklist.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate publication plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_plan.py --format text
          python3 scripts/release_plan.py --format tsv --output /tmp/release-packages.tsv
          python3 scripts/release_plan.py --format json --output /tmp/release-plan.json
          test "$(wc -l < /tmp/release-packages.tsv)" -eq 17

      - name: Build pre-publication release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/package-files

          while IFS=$'\t' read -r package version; do
            cargo package --locked -p "$package" --list \
              > "release-artifacts/package-files/${package}-${version}.txt"
            test -s "release-artifacts/package-files/${package}-${version}.txt"
          done < /tmp/release-packages.tsv

          test "$(find release-artifacts/package-files -maxdepth 1 -name '*.txt' -type f | wc -l)" -eq 17

          git archive --format=tar --prefix="berserk-${GITHUB_SHA}/" HEAD \
            | gzip -n > "release-artifacts/berserk-source-${GITHUB_SHA}.tar.gz"
          test -s "release-artifacts/berserk-source-${GITHUB_SHA}.tar.gz"

      - name: Record release manifest and publish order
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess

          with open("/tmp/release-plan.json", encoding="utf-8") as handle:
              plan = json.load(handle)

          manifest = {
              "schema_version": 3,
              "artifact_model": "pre-publication-source-evidence",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "source_ref": os.environ.get("GITHUB_REF", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "rustc": subprocess.check_output(
                  ["rustc", "--version", "--verbose"], text=True
              ).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "version": plan["version"],
              "packages": plan["packages"],
              "publish_layers": plan["publish_layers"],
              "publish_order": plan["publish_order"],
          }

          pathlib.Path("release-artifacts/RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PYTHON

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          find . -type f \
            ! -name SHA256SUMS \
            ! -name provenance.sigstore.json \
            -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 19
          sha256sum -c SHA256SUMS

      - name: Generate GitHub build provenance
        if: github.event_name == 'workflow_dispatch'
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: release-artifacts/SHA256SUMS

      - name: Retain provenance bundle
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" release-artifacts/provenance.sigstore.json

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: berserk-release-evidence-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
