name: Release artifacts

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/release-artifacts.yml"
      - "docs/release-provenance.md"
      - "docs/release-checklist.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build pre-publication release evidence
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --locked --no-deps --format-version 1 > /tmp/metadata.json
          mkdir -p release-artifacts/package-files

          python3 - <<'PYTHON' > /tmp/release-packages.tsv
          import json

          wanted = [
              "berserk-core",
              "berserk-validation",
              "berserk-database",
              "claw-orm",
              "berserk-auth",
              "berserk-openapi",
              "berserk-cache",
              "berserk-storage",
              "berserk-events",
              "berserk-jobs",
              "berserk-client",
              "berserk-notifications",
              "berserk-cli",
              "berserk-testing",
              "berserk",
          ]

          with open("/tmp/metadata.json", encoding="utf-8") as handle:
              metadata = json.load(handle)

          packages = {package["name"]: package for package in metadata["packages"]}
          missing = [name for name in wanted if name not in packages]
          if missing:
              raise SystemExit(f"missing publishable packages: {missing}")

          for name in wanted:
              package = packages[name]
              if package.get("publish") == []:
                  raise SystemExit(f"{name}: publication is disabled")
              print(f"{name}\t{package['version']}")
          PYTHON

          while IFS=$'\t' read -r package version; do
            cargo package --locked -p "$package" --list \
              > "release-artifacts/package-files/${package}-${version}.txt"
            test -s "release-artifacts/package-files/${package}-${version}.txt"
          done < /tmp/release-packages.tsv

          test "$(find release-artifacts/package-files -maxdepth 1 -name '*.txt' -type f | wc -l)" -eq 15

          git archive --format=tar --prefix="berserk-${GITHUB_SHA}/" HEAD \
            | gzip -n > "release-artifacts/berserk-source-${GITHUB_SHA}.tar.gz"
          test -s "release-artifacts/berserk-source-${GITHUB_SHA}.tar.gz"

      - name: Record release manifest and publish order
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess

          wanted = [
              "berserk-core",
              "berserk-validation",
              "berserk-database",
              "claw-orm",
              "berserk-auth",
              "berserk-openapi",
              "berserk-cache",
              "berserk-storage",
              "berserk-events",
              "berserk-jobs",
              "berserk-client",
              "berserk-notifications",
              "berserk-cli",
              "berserk-testing",
              "berserk",
          ]
          wanted_set = set(wanted)

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          packages = {package["name"]: package for package in metadata["packages"]}

          internal_dependencies = {}
          for name in wanted:
              deps = set()
              for dependency in packages[name].get("dependencies", []):
                  if dependency.get("kind") == "dev":
                      continue
                  dependency_name = dependency["name"]
                  if dependency_name in wanted_set:
                      deps.add(dependency_name)
              internal_dependencies[name] = sorted(deps)

          remaining = {name: set(deps) for name, deps in internal_dependencies.items()}
          publish_order = []
          while remaining:
              ready = sorted(name for name, deps in remaining.items() if not deps)
              if not ready:
                  raise SystemExit(f"internal dependency cycle: {remaining}")
              publish_order.extend(ready)
              for name in ready:
                  remaining.pop(name)
              for deps in remaining.values():
                  deps.difference_update(ready)

          manifest = {
              "schema_version": 2,
              "artifact_model": "pre-publication-source-evidence",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "source_ref": os.environ.get("GITHUB_REF", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "rustc": subprocess.check_output(
                  ["rustc", "--version", "--verbose"], text=True
              ).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "packages": [
                  {
                      "name": name,
                      "version": packages[name]["version"],
                      "internal_dependencies": internal_dependencies[name],
                  }
                  for name in wanted
              ],
              "publish_order": publish_order,
          }

          pathlib.Path("release-artifacts/RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PYTHON

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          find . -type f \
            ! -name SHA256SUMS \
            ! -name provenance.sigstore.json \
            -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 17
          sha256sum -c SHA256SUMS

      - name: Generate GitHub build provenance
        if: github.event_name == 'workflow_dispatch'
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: release-artifacts/SHA256SUMS

      - name: Retain provenance bundle
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" release-artifacts/provenance.sigstore.json

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: berserk-release-evidence-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
