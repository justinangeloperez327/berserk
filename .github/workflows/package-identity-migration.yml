name: Package identity migration

on:
  push:
    branches:
      - chatgpt/package-release-readiness

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/package-release-readiness
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply package identity migration
        run: python3 scripts/package_identity_migration.py
      - name: Refresh lockfile and verify migration
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --check
          if git grep -n -E 'framework-(core|validation|database|auth|openapi|cache|storage|events|jobs|client|notifications|cli|testing|benchmarks)' -- ':!Cargo.lock' ':!scripts/package_identity_migration.py' ':!.github/workflows/package-identity-migration.yml'; then
            echo "stale framework-* package identity remains" >&2
            exit 1
          fi
          if git grep -n -E 'framework_(core|validation|database|auth|openapi|cache|storage|events|jobs|client|notifications|cli|testing|benchmarks)' -- ':!Cargo.lock' ':!scripts/package_identity_migration.py' ':!.github/workflows/package-identity-migration.yml'; then
            echo "stale framework_* crate identity remains" >&2
            exit 1
          fi
          rm scripts/package_identity_migration.py
          rm .github/workflows/package-identity-migration.yml
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare crates.io package identities and release metadata"
          git push origin HEAD:chatgpt/package-release-readiness
