name: Package identity migration

on:
  push:
    branches:
      - chatgpt/package-release-readiness

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/package-release-readiness
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply package identity migration
        run: python3 scripts/package_identity_migration.py
      - name: Refresh lockfiles and verify migration
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/framework-benchmarks/berserk-benchmarks/g' benchmarks/collect.py
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path examples/minimal-api/Cargo.toml
          if git grep -n -E 'framework-(core|validation|database|auth|openapi|cache|storage|events|jobs|client|notifications|cli|testing|benchmarks)' -- ':!scripts/package_identity_migration.py' ':!.github/workflows/package-identity-migration.yml'; then
            echo "stale framework-* package identity remains" >&2
            exit 1
          fi
          if git grep -n -E 'framework_(core|validation|database|auth|openapi|cache|storage|events|jobs|client|notifications|cli|testing|benchmarks)' -- ':!scripts/package_identity_migration.py' ':!.github/workflows/package-identity-migration.yml'; then
            echo "stale framework_* crate identity remains" >&2
            exit 1
          fi
          rm scripts/package_identity_migration.py
          rm .github/workflows/package-identity-migration.yml
          git add -A
          git diff --cached --check
      - name: Upload non-workflow migration tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          base = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "berserk-package-migration",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          commit = request("GET", f"/repos/{repo}/git/commits/{base}")
          base_tree = commit["tree"]["sha"]
          names = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z", base, "--"]
          ).decode().split("\0")
          entries = []
          workflow_paths = []
          for raw in names:
              if not raw:
                  continue
              if raw.startswith(".github/workflows/"):
                  workflow_paths.append(raw)
                  continue
              path = Path(raw)
              if not path.exists():
                  entries.append({"path": raw, "mode": "100644", "type": "blob", "sha": None})
                  continue
              mode_line = subprocess.check_output(["git", "ls-files", "-s", "--", raw], text=True).strip()
              mode = mode_line.split()[0] if mode_line else "100644"
              content = base64.b64encode(path.read_bytes()).decode()
              blob = request(
                  "POST",
                  f"/repos/{repo}/git/blobs",
                  {"content": content, "encoding": "base64"},
              )
              entries.append({"path": raw, "mode": mode, "type": "blob", "sha": blob["sha"]})

          tree = request(
              "POST",
              f"/repos/{repo}/git/trees",
              {"base_tree": base_tree, "tree": entries},
          )
          print(f"NON_WORKFLOW_TREE_SHA={tree['sha']}")
          print(f"BASE_COMMIT_SHA={base}")
          print(f"NON_WORKFLOW_CHANGED_FILES={len(entries)}")
          for path in workflow_paths:
              print(f"WORKFLOW_PATH={path}")
          PY
