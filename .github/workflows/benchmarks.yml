name: Performance baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh stale lockfile once
        shell: bash
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh lockfile for benchmark workspace member"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
      - name: Build release benchmark
        run: cargo build --locked --release -p framework-benchmarks
      - name: Collect checked samples and process memory
        run: python3 benchmarks/collect.py
      - name: Retain measurements and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
