name: Format Arr branch

on:
  push:
    branches:
      - feature/arr-helper

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/arr-helper
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/framework/src/support/array.rs crates/framework/src/support/string.rs crates/framework/src/lib.rs crates/framework/src/prelude.rs
          git commit -m "style: format Arr helper"
          git push origin HEAD:feature/arr-helper
