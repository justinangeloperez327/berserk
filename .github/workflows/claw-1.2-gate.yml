name: Claw 1.2 gate

on:
  push:
    branches: [release/1.2]
    paths:
      - ".claw-1.2-ready"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace
      - run: cargo test --locked -p claw-orm
      - run: cargo clippy --locked -p claw-orm --all-targets -- -D warnings
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style(1.2): format Claw ORM"
            git push origin HEAD:release/1.2
          fi
