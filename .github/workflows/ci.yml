name: CI

on:
  push:
    branches: [main, eager-loading, "feature/**", "release/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked Cargo build output
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          generated = [path for path in paths if b"target" in path.split(b"/")[:-1]]
          for path in generated:
              print("Tracked Cargo build output:", repr(path))
          sys.exit(bool(generated))
          PYTHON

  feature-core:
    name: feature-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-core
      - name: Check no default features
        run: cargo check -p berserk --all-targets --no-default-features
      - name: Check async actions
        run: cargo check -p berserk --all-targets --no-default-features --features async
      - name: Check async model actions
        run: cargo check -p berserk --all-targets --no-default-features --features async,claw,auth
      - name: Check database feature
        run: cargo check -p berserk --all-targets --no-default-features --features database
      - name: Check Claw ORM feature
        run: cargo check -p berserk --all-targets --no-default-features --features claw
      - name: Check PostgreSQL feature
        run: cargo check -p berserk --all-targets --no-default-features --features postgres
      - name: Check MySQL feature
        run: cargo check -p berserk --all-targets --no-default-features --features mysql
      - name: Check SQLite feature
        run: cargo check -p berserk --all-targets --no-default-features --features sqlite

  feature-services:
    name: feature-services
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-services
      - name: Check auth feature
        run: cargo check -p berserk --all-targets --no-default-features --features auth
      - name: Check view feature
        run: cargo check -p berserk --all-targets --no-default-features --features view
      - name: Check OpenAPI feature
        run: cargo check -p berserk --all-targets --no-default-features --features openapi
      - name: Check cache feature
        run: cargo check -p berserk --all-targets --no-default-features --features cache
      - name: Check storage feature
        run: cargo check -p berserk --all-targets --no-default-features --features storage
      - name: Check events feature
        run: cargo check -p berserk --all-targets --no-default-features --features events
      - name: Check jobs feature
        run: cargo check -p berserk --all-targets --no-default-features --features jobs

  feature-integrations:
    name: feature-integrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-integrations
      - name: Check client feature
        run: cargo check -p berserk --all-targets --no-default-features --features client
      - name: Check notifications feature
        run: cargo check -p berserk --all-targets --no-default-features --features notifications
      - name: Check CLI feature
        run: cargo check -p berserk --all-targets --no-default-features --features cli
      - name: Check auth and OpenAPI combination
        run: cargo check -p berserk --all-targets --no-default-features --features auth,openapi
      - name: Check Claw ORM and SQLite combination
        run: cargo check -p berserk --all-targets --no-default-features --features claw,sqlite
      - name: Check Claw ORM and view combination
        run: cargo check -p berserk --all-targets --no-default-features --features claw,view

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/minimal-api -> target
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace
      - run: cargo test --locked --workspace
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run --locked -p claw-orm --example relationships --features sqlite
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --manifest-path examples/minimal-api/Cargo.toml
      - run: python3 scripts/verify_generators.py
      - run: python3 scripts/release_plan.py --format json
      - run: git diff --exit-code Cargo.lock

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  platform-compatibility:
    name: platform-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
