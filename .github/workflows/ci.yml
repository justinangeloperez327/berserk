name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked Cargo build output
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          generated = [path for path in paths if b"target" in path.split(b"/")[:-1]]
          for path in generated:
              print("Tracked Cargo build output:", repr(path))
          sys.exit(bool(generated))
          PYTHON

  feature-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: database
            args: --no-default-features --features database
          - name: claw
            args: --no-default-features --features claw
          - name: postgres
            args: --no-default-features --features postgres
          - name: mysql
            args: --no-default-features --features mysql
          - name: sqlite
            args: --no-default-features --features sqlite
          - name: auth
            args: --no-default-features --features auth
          - name: openapi
            args: --no-default-features --features openapi
          - name: cache
            args: --no-default-features --features cache
          - name: storage
            args: --no-default-features --features storage
          - name: events
            args: --no-default-features --features events
          - name: jobs
            args: --no-default-features --features jobs
          - name: client
            args: --no-default-features --features client
          - name: notifications
            args: --no-default-features --features notifications
          - name: cli
            args: --no-default-features --features cli
          - name: api-with-auth
            args: --no-default-features --features auth,openapi
          - name: claw-with-sqlite
            args: --no-default-features --features claw,sqlite
    name: feature-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p berserk --all-targets ${{ matrix.args }}

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/minimal-api -> target
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --manifest-path examples/minimal-api/Cargo.toml

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  platform-compatibility:
    name: platform-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
