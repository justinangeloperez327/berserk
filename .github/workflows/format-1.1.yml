name: Format 1.1

on:
  workflow_dispatch:
  push:
    branches: ["release/1.1"]
    paths:
      - ".github/workflows/format-1.1.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/1.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(1.1): apply rustfmt to migration subsystem"
          git push origin HEAD:release/1.1
