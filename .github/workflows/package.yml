name: Package

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "benchmarks/Cargo.toml"
      - "examples/**/Cargo.toml"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify canonical Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify release package identities
        shell: bash
        run: |
          set -euo pipefail
          test ! -e LICENCE
          test -s LICENSE
          ! git grep -n -E 'framework-(core|validation|database|auth|openapi|cache|storage|events|jobs|client|notifications|cli|testing|benchmarks)' -- ':!Cargo.lock'
          ! git grep -n -E 'framework_(core|validation|database|auth|openapi|cache|storage|events|jobs|client|notifications|cli|testing|benchmarks)' -- ':!Cargo.lock'
          cargo metadata --locked --no-deps --format-version 1 > /tmp/metadata.json
          python3 - <<'CHECK'
          import json
          data = json.load(open('/tmp/metadata.json'))
          expected = {
              'berserk', 'berserk-core', 'berserk-validation', 'berserk-database',
              'claw-orm', 'berserk-auth', 'berserk-openapi', 'berserk-cache',
              'berserk-storage', 'berserk-events', 'berserk-jobs', 'berserk-client',
              'berserk-notifications', 'berserk-cli', 'berserk-testing',
          }
          packages = {p['name']: p for p in data['packages']}
          missing = expected - packages.keys()
          if missing:
              raise SystemExit(f'missing expected packages: {sorted(missing)}')
          for name in expected:
              package = packages[name]
              if package['version'] != '0.2.0':
                  raise SystemExit(f'{name}: expected version 0.2.0, got {package["version"]}')
              if package.get('publish') == []:
                  raise SystemExit(f'{name}: publication is disabled')
              if package.get('license') != 'MIT':
                  raise SystemExit(f'{name}: expected MIT license metadata')
              if package.get('repository') != 'https://github.com/justinangeloperez327/berserk':
                  raise SystemExit(f'{name}: repository metadata mismatch')
          for name in {'foundation-example', 'berserk-benchmarks'}:
              package = packages[name]
              if package.get('publish') != []:
                  raise SystemExit(f'{name}: must remain non-publishable')
          CHECK
      - name: Inspect every package file list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-lists
          packages=(
            berserk-core berserk-validation berserk-database claw-orm berserk-auth
            berserk-openapi berserk-cache berserk-storage berserk-events berserk-jobs
            berserk-client berserk-notifications berserk-cli berserk-testing berserk
          )
          for package in "${packages[@]}"; do
            cargo package --locked -p "$package" --list > "package-lists/$package.txt"
            if grep -E '(^|/)(target|benchmark-results|\.git)(/|$)|(^|/)\.env($|\.)|\.(pem|key)$|credentials' "package-lists/$package.txt"; then
              echo "forbidden packaged path detected in $package" >&2
              exit 1
            fi
          done
      - name: Build first-publication foundation archives
        shell: bash
        run: |
          set -euo pipefail
          for package in berserk-core berserk-validation berserk-database; do
            cargo package --locked -p "$package" --no-verify --allow-dirty
          done
      - name: Retain package file lists
        uses: actions/upload-artifact@v4
        with:
          name: package-file-lists-${{ github.sha }}
          path: package-lists/
          if-no-files-found: error
          retention-days: 30

  clean-consumer:
    name: clean-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile README quick start from a fresh external project
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          mkdir -p "$consumer/src"

          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "berserk-clean-consumer"
          version = "0.1.0"
          edition = "2021"
          rust-version = "1.88"
          publish = false

          [workspace]

          [dependencies]
          berserk = { path = "${GITHUB_WORKSPACE}/crates/framework" }
          EOF

          cat > "$consumer/src/main.rs" <<'RUST'
          use berserk::{App, Response, Result};

          fn main() -> Result<()> {
              let mut app = App::new();

              {
                  let mut route = app.route();
                  route.get("/", || Response::text("Hello from Berserk!"))?;
                  route.get("/users/{id}", show_user)?;
              }

              app.listen("127.0.0.1:3000")
          }

          fn show_user(id: u64) -> Response {
              Response::text(format!("User {id}"))
          }
          RUST

          cargo check --manifest-path "$consumer/Cargo.toml"

      - name: Compile documented optional feature combination externally
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          mkdir -p "$consumer/src"

          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "berserk-feature-consumer"
          version = "0.1.0"
          edition = "2021"
          rust-version = "1.88"
          publish = false

          [workspace]

          [dependencies]
          berserk = { path = "${GITHUB_WORKSPACE}/crates/framework", features = ["sqlite", "claw", "auth", "openapi"] }
          EOF

          cat > "$consumer/src/main.rs" <<'RUST'
          use berserk::{App, Response, Result};

          fn main() -> Result<()> {
              let mut app = App::new();
              let mut route = app.route();
              route.get("/health", || Response::text("OK"))?;
              Ok(())
          }
          RUST

          cargo check --manifest-path "$consumer/Cargo.toml"
