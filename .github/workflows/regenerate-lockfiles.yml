name: Regenerate lockfiles

on:
  push:
    branches: ["release/1.0"]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile
      - name: Regenerate minimal API lockfile
        run: cargo generate-lockfile --manifest-path examples/minimal-api/Cargo.toml
      - name: Commit generated lockfiles
        run: |
          if git diff --quiet -- Cargo.lock examples/minimal-api/Cargo.lock; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock examples/minimal-api/Cargo.lock
          git commit -m "chore(1.0): regenerate Cargo lockfiles"
          git push origin HEAD:release/1.0
