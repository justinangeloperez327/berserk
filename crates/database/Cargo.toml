[package]
name = "berserk-database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Database abstractions, query building, migrations, and SQL drivers for Berserk."
publish = true

[features]
default = []
postgres = ["dep:postgres", "dep:bytes"]
mysql = ["dep:mysql"]
sqlite = ["dep:rusqlite"]

[dependencies]
bytes = { workspace = true, optional = true }
scoped-tls-hkt = { workspace = true }
postgres = { workspace = true, optional = true }
mysql = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
