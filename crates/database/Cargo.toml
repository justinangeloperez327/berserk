[package]
name = "berserk-database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Database abstractions, query building, migrations, and SQL drivers for Berserk."
publish = true

[features]
default = []
postgres = ["dep:postgres"]
mysql = ["dep:mysql"]
sqlite = ["dep:rusqlite"]

[dependencies]
postgres = { version = "0.19.14", optional = true }
mysql = { version = "28.0.2", default-features = false, features = ["minimal-rust", "rustls-tls-ring"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
