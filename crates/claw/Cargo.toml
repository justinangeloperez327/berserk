[package]
name = "claw-orm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Claw ORM models, typed queries, persistence, and relationships for Berserk."
publish = true

[dependencies]
berserk-database.workspace = true

[features]
sqlite = ["berserk-database/sqlite"]
postgres = ["berserk-database/postgres"]
mysql = ["berserk-database/mysql"]

[dev-dependencies]
berserk-database = { workspace = true, features = ["sqlite"] }

[[example]]
name = "relationships"
required-features = ["sqlite"]
