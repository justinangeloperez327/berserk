[package]
name = "berserk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Berserk web framework for secure, maintainable Rust applications."
publish = true

[features]
default = ["server"]
server = ["dep:bytes", "dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tokio"]
async = ["dep:tokio"]
database = ["dep:berserk-database"]
claw = ["database", "dep:claw-orm", "dep:berserk-macros"]
postgres = ["database", "berserk-database/postgres"]
mysql = ["database", "berserk-database/mysql"]
sqlite = ["database", "berserk-database/sqlite"]
auth = ["dep:berserk-auth"]
view = ["dep:berserk-axe"]
openapi = ["dep:berserk-openapi"]
cache = ["dep:berserk-cache"]
storage = ["dep:berserk-storage"]
events = ["dep:berserk-events"]
jobs = ["dep:berserk-jobs"]
client = ["dep:berserk-client"]
notifications = ["client", "dep:berserk-notifications"]
cli = ["dep:berserk-cli"]

[dependencies]
berserk-core.workspace = true
berserk-macros = { workspace = true, optional = true }
berserk-validation = { workspace = true }
berserk-database = { workspace = true, optional = true }
claw-orm = { workspace = true, optional = true }
berserk-auth = { workspace = true, optional = true }
berserk-axe = { workspace = true, optional = true }
berserk-openapi = { workspace = true, optional = true }
getrandom = { workspace = true }
berserk-cache = { workspace = true, optional = true }
berserk-storage = { workspace = true, optional = true }
berserk-events = { workspace = true, optional = true }
berserk-jobs = { workspace = true, optional = true }
berserk-client = { workspace = true, optional = true }
berserk-notifications = { workspace = true, optional = true }
berserk-cli = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[[test]]
name = "server"
required-features = ["server"]

[[test]]
name = "reliability"
required-features = ["server"]

[[test]]
name = "http_expansion"
required-features = ["server"]

[[example]]
name = "json"
required-features = ["server"]

[[example]]
name = "middleware"
required-features = ["server"]
